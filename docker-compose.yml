services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fieldproof
      POSTGRES_PASSWORD: fieldproof
      POSTGRES_DB: fieldproof
    ports:
      - "5432:5432"
    volumes:
      - fieldproof_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldproof"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://fieldproof:fieldproof@db:5432/fieldproof
      UPLOAD_ROOT: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - fieldproof_uploads:/app/uploads

volumes:
  fieldproof_pg:
  fieldproof_uploads:
